<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Duo Test - Free Mock Tests by The Duo</title>
<meta name="description" content="Free timed mock tests with negative marking, in English and Assamese. Made by The Duo YouTube channel.">
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#1b2133; --muted:#667085; --line:#e4e7ef;
  --brand:#5b3df5; --brand2:#ff6b3d; --good:#12a150; --bad:#e5383b; --warn:#f59e0b;
  --radius:16px; --shadow:0 6px 24px rgba(30,30,80,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px;cursor:pointer}
.logo span{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:6px;align-items:center}
.links button{background:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.links button:hover,.links button.on{background:#eef0ff;color:var(--brand)}
.yt{background:#ff0033!important;color:#fff!important}
.menu-btn{display:none;background:none;font-size:24px}
@media(max-width:720px){
  .menu-btn{display:block}
  .links{display:none;position:absolute;top:60px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:10px 16px;border-bottom:1px solid var(--line)}
  .links.open{display:flex}
}

/* hero */
.hero{padding:40px 0 20px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.pill{display:inline-block;background:#eef0ff;color:var(--brand);font-weight:700;font-size:13px;padding:5px 12px;border-radius:99px;margin-bottom:12px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1;letter-spacing:-1px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{color:var(--muted);margin:14px 0 20px;font-size:17px}
.btn{display:inline-block;padding:12px 20px;border-radius:12px;font-weight:700}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:#ff0033;color:#fff}
.stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.stats b{display:block;font-size:24px}
.stats small{color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.sample .tag{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
.sample .q{font-weight:700;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;color:var(--ink)}
.opt:hover{border-color:var(--brand)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#eef0ff;color:var(--brand);font-weight:800;display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--brand);background:#f3f1ff}
.opt.right{border-color:var(--good);background:#eafaf1}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.sel .l{background:var(--brand);color:#fff}

.seg{display:inline-flex;background:#eceef6;border-radius:10px;padding:3px}
.seg button{background:none;padding:5px 12px;border-radius:8px;font-weight:700;color:var(--muted);font-size:13px}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* sections */
section.blk{margin:34px 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.sh h2{font-size:22px;letter-spacing:-.3px}
.sh a{color:var(--brand);font-weight:700;font-size:14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.tile:hover{transform:translateY(-3px);border-color:var(--brand)}
.tile .ico{font-size:28px}
.tile h3{font-size:17px}
.tile small{color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:#eafaf1;color:var(--good);width:max-content}
.badge.lock{background:#fff3e6;color:var(--brand2)}

.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border:0}
.rank{width:28px;font-weight:800;color:var(--brand)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.lb-row .grow{flex:1}
.lb-row .pc{font-weight:800}
.empty{color:var(--muted);padding:10px 0}

.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.why .card h3{margin-bottom:4px;font-size:16px}
.why .card p{color:var(--muted);font-size:14px}

.cta{background:linear-gradient(135deg,var(--brand),#8b5cf6);color:#fff;border-radius:22px;padding:30px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h2{font-size:24px}
.cta p{opacity:.9}

footer{background:#fff;border-top:1px solid var(--line);margin-top:50px;padding:30px 0;color:var(--muted);font-size:14px}
.fgrid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}

/* test */
.tbar{position:sticky;top:60px;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 0}
.tbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:#fff3e6;color:var(--brand2);padding:6px 12px;border-radius:10px}
.timer.low{background:#fdecec;color:var(--bad)}
.prog{height:6px;background:#eceef6;border-radius:99px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:.2s}
.qbox{margin:18px 0}
.qno{color:var(--muted);font-weight:700;font-size:13px;margin-bottom:6px}
.qtext{font-size:19px;font-weight:700;margin-bottom:16px}
.qtext small{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-top:4px}
.opt small{display:block;color:var(--muted);font-size:13px}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.palette button{width:36px;height:36px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-weight:700;color:var(--muted)}
.palette button.ans{background:var(--brand);border-color:var(--brand);color:#fff}
.palette button.cur{outline:3px solid #c9c0ff}

/* result */
.score{text-align:center}
.score .big{font-size:56px;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.rgrid div{background:#f6f7fb;border-radius:12px;padding:12px}
.rgrid b{display:block;font-size:22px}
.expl{background:#f3f1ff;border-radius:10px;padding:10px 12px;margin:6px 0 18px;font-size:14px}
.rev{margin-bottom:6px}
.hidden{display:none!important}
dialog{border:0;border-radius:16px;padding:24px;max-width:380px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,10,30,.5)}
dialog input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin:12px 0}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="logo" onclick="go('home')">The Duo <span>Test</span></div>
    <button class="menu-btn" onclick="document.getElementById('links').classList.toggle('open')" aria-label="Menu">☰</button>
    <nav class="links" id="links">
      <button data-v="home" onclick="go('home')">Home</button>
      <button data-v="exams" onclick="go('exams')">All Tests</button>
      <button data-v="leaderboard" onclick="go('leaderboard')">Leaderboard</button>
      <button data-v="about" onclick="go('about')">About</button>
      <a class="btn yt" id="ytTop" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:10px">▶ YouTube</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap fgrid">
    <div>
      <div class="logo" style="margin-bottom:6px">The Duo <span>Test</span></div>
      <div>Free mock tests made by The Duo YouTube channel.</div>
    </div>
    <div>
      <div>© <span id="yr"></span> The Duo. All rights reserved.</div>
      <div><a id="ytFoot" target="_blank" rel="noopener" style="color:var(--brand);font-weight:700">Subscribe on YouTube</a></div>
    </div>
  </div>
</footer>

<dialog id="nameDlg">
  <h3>Join the leaderboard</h3>
  <p style="color:var(--muted);font-size:14px">Enter your name and district. They are saved only in this browser.</p>
  <input id="nmIn" placeholder="Your name" maxlength="24">
  <input id="dsIn" placeholder="District (optional)" maxlength="24">
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn ghost" onclick="skipName()">Skip</button>
    <button class="btn primary" onclick="saveName()">Save</button>
  </div>
</dialog>

<script>
/* =====================================================
   1. SITE SETTINGS — edit these
   ===================================================== */
const SITE = {
  name: "The Duo",
  youtube: "https://www.youtube.com/@theduo",   // <- put your real channel link
  whatsapp: "",                                  // optional channel/group link
  negativeMarking: 0.25,                         // marks lost per wrong answer
  marksPerQuestion: 1
};

/* =====================================================
   2. CATEGORIES (shown on home page)
   ===================================================== */
const CATEGORIES = [
  { id:"assam",   icon:"🏞️", name:"Assam Special" },
  { id:"gk",      icon:"🌍", name:"General Knowledge" },
  { id:"science", icon:"🔬", name:"Science" },
  { id:"english", icon:"📘", name:"English" }
];

/* =====================================================
   3. TESTS & QUESTIONS — add your own here
   Each question: q{en,as}, o[4]{en,as}, a = index of correct option (0-3), exp = explanation
   "as" (Assamese) is optional; English shows if it is missing.
   free:true  = anyone can attempt.  free:false = shows a lock note (hook for your own gating)
   ===================================================== */
const TESTS = [
 {
  id:"assam-1", cat:"assam", title:"Assam GK – Test 1", minutes:5, free:true,
  questions:[
   { q:{en:"What is the capital of Assam?", as:"অসমৰ ৰাজধানী কি?"},
     o:[{en:"Guwahati",as:"গুৱাহাটী"},{en:"Dispur",as:"দিছপুৰ"},{en:"Jorhat",as:"যোৰহাট"},{en:"Silchar",as:"শিলচৰ"}],
     a:1, exp:"Dispur, in Guwahati, is the capital of Assam." },
   { q:{en:"Which river is called the lifeline of Assam?", as:"অসমৰ জীৱনৰেখা বুলি কোনখন নদীক কোৱা হয়?"},
     o:[{en:"Barak",as:"বৰাক"},{en:"Manas",as:"মানাহ"},{en:"Brahmaputra",as:"ব্ৰহ্মপুত্ৰ"},{en:"Subansiri",as:"সুবনশিৰি"}],
     a:2, exp:"The Brahmaputra flows through the length of the Assam valley." },
   { q:{en:"Kaziranga National Park is famous for which animal?", as:"কাজিৰঙা ৰাষ্ট্ৰীয় উদ্যান কোন জন্তুৰ বাবে বিখ্যাত?"},
     o:[{en:"Tiger",as:"বাঘ"},{en:"One-horned rhinoceros",as:"এশিংযুক্ত গড়"},{en:"Lion",as:"সিংহ"},{en:"Snow leopard",as:"তুষাৰ চিতাবাঘ"}],
     a:1, exp:"Kaziranga holds most of the world's one-horned rhinos." },
   { q:{en:"Which of these is a major festival of Assam?", as:"তলৰ কোনটো অসমৰ প্ৰধান উৎসৱ?"},
     o:[{en:"Onam",as:"অনম"},{en:"Bihu",as:"বিহু"},{en:"Pongal",as:"পোংগল"},{en:"Lohri",as:"লোহৰী"}],
     a:1, exp:"Bihu (Rongali, Kongali, Bhogali) is Assam's main festival." },
   { q:{en:"Majuli, the largest river island, lies in which river?", as:"বিশ্বৰ ডাঙৰ নদীদ্বীপ মাজুলী কোনখন নদীত অৱস্থিত?"},
     o:[{en:"Brahmaputra",as:"ব্ৰহ্মপুত্ৰ"},{en:"Ganga",as:"গংগা"},{en:"Yamuna",as:"যমুনা"},{en:"Godavari",as:"গোদাৱৰী"}],
     a:0, exp:"Majuli is in the Brahmaputra." }
  ]
 },
 {
  id:"gk-1", cat:"gk", title:"General Knowledge – Test 1", minutes:5, free:true,
  questions:[
   { q:{en:"Who is known as the Father of the Nation in India?", as:"ভাৰতৰ ৰাষ্ট্ৰপিতা কোন?"},
     o:[{en:"Jawaharlal Nehru",as:"জৱাহৰলাল নেহৰু"},{en:"Mahatma Gandhi",as:"মহাত্মা গান্ধী"},{en:"Sardar Patel",as:"সৰ্দাৰ পেটেল"},{en:"B. R. Ambedkar",as:"বি. আৰ. আম্বেদকাৰ"}],
     a:1, exp:"Mahatma Gandhi is called the Father of the Nation." },
   { q:{en:"Which is the national animal of India?", as:"ভাৰতৰ ৰাষ্ট্ৰীয় জন্তু কোনটো?"},
     o:[{en:"Lion",as:"সিংহ"},{en:"Elephant",as:"হাতী"},{en:"Tiger",as:"বাঘ"},{en:"Leopard"}],
     a:2, exp:"The Bengal tiger is India's national animal." },
   { q:{en:"How many states does India have?", as:"ভাৰতত কেইটা ৰাজ্য আছে?"},
     o:[{en:"26"},{en:"28"},{en:"29"},{en:"30"}],
     a:1, exp:"India has 28 states and 8 Union Territories." },
   { q:{en:"The Constitution of India came into effect on:", as:"ভাৰতৰ সংবিধান কাৰ্যকৰী হয়:"},
     o:[{en:"15 August 1947"},{en:"26 January 1950"},{en:"2 October 1949"},{en:"26 November 1949"}],
     a:1, exp:"It came into force on 26 January 1950 (Republic Day)." },
   { q:{en:"Which planet is known as the Red Planet?", as:"কোনটো গ্ৰহক ৰঙা গ্ৰহ বুলি কোৱা হয়?"},
     o:[{en:"Venus",as:"শুক্ৰ"},{en:"Mars",as:"মংগল"},{en:"Jupiter",as:"বৃহস্পতি"},{en:"Saturn",as:"শনি"}],
     a:1, exp:"Mars looks red because of iron oxide on its surface." }
  ]
 },
 {
  id:"sci-1", cat:"science", title:"Science Basics – Test 1", minutes:4, free:true,
  questions:[
   { q:{en:"What is the chemical symbol for water?"},
     o:[{en:"O2"},{en:"CO2"},{en:"H2O"},{en:"HO"}], a:2, exp:"Water is two hydrogen atoms bonded to one oxygen atom." },
   { q:{en:"Which gas do plants take in for photosynthesis?"},
     o:[{en:"Oxygen"},{en:"Carbon dioxide"},{en:"Nitrogen"},{en:"Hydrogen"}], a:1, exp:"Plants use CO2, water and sunlight to make glucose." },
   { q:{en:"What is the powerhouse of the cell?"},
     o:[{en:"Nucleus"},{en:"Ribosome"},{en:"Mitochondria"},{en:"Golgi body"}], a:2, exp:"Mitochondria produce most of the cell's ATP." },
   { q:{en:"The SI unit of force is:"},
     o:[{en:"Joule"},{en:"Newton"},{en:"Watt"},{en:"Pascal"}], a:1, exp:"Force is measured in newtons (N)." },
   { q:{en:"Which vitamin do we get from sunlight?"},
     o:[{en:"Vitamin A"},{en:"Vitamin B12"},{en:"Vitamin C"},{en:"Vitamin D"}], a:3, exp:"Skin makes vitamin D when exposed to UVB light." }
  ]
 },
 {
  id:"eng-1", cat:"english", title:"English Grammar – Test 1", minutes:4, free:true,
  questions:[
   { q:{en:"Choose the correct sentence."},
     o:[{en:"She go to school."},{en:"She goes to school."},{en:"She going to school."},{en:"She gone to school."}], a:1, exp:"Third person singular takes 'goes'." },
   { q:{en:"Synonym of 'Happy':"},
     o:[{en:"Sad"},{en:"Angry"},{en:"Joyful"},{en:"Tired"}], a:2, exp:"Joyful means feeling happiness." },
   { q:{en:"Antonym of 'Brave':"},
     o:[{en:"Bold"},{en:"Cowardly"},{en:"Strong"},{en:"Fearless"}], a:1, exp:"Cowardly is the opposite of brave." },
   { q:{en:"Fill in the blank: He is ___ honest man."},
     o:[{en:"a"},{en:"an"},{en:"the"},{en:"no article"}], a:1, exp:"'Honest' starts with a vowel sound, so use 'an'." },
   { q:{en:"Past tense of 'write':"},
     o:[{en:"Writed"},{en:"Wrote"},{en:"Written"},{en:"Writes"}], a:1, exp:"Write → wrote → written." }
  ]
 }
];

/* =====================================================
   4. APP CODE (you normally don't need to edit below)
   ===================================================== */
const $ = s => document.querySelector(s);
const app = $("#app");
let LANG = localStorage.getItem("duo_lang") || "en";
let T = null; // active test state
let timerId = null;

/* ---- storage helpers ---- */
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const getAttempts = () => store.get("duo_attempts", []);
const getUser = () => store.get("duo_user", null);

/* ---- language helpers ---- */
const tx = o => (o && (LANG==="as" ? (o.as||o.en) : o.en)) || "";
const both = o => {
  if(!o) return "";
  if(o.as && o.as !== o.en) return `${esc(o.en)}<small>${esc(o.as)}</small>`;
  return esc(o.en);
};
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function setLang(l){
  LANG=l; localStorage.setItem("duo_lang",l);
  if(location.hash.startsWith("#test")) renderQuestion(); else render();
}
const LB = (en,as) => LANG==="as" ? as : en;

/* ---- routing ---- */
function go(v, arg){
  clearInterval(timerId);
  document.getElementById("links").classList.remove("open");
  location.hash = arg ? `${v}/${arg}` : v;
}
window.addEventListener("hashchange", render);

function render(){
  const [v, arg] = (location.hash.replace("#","")||"home").split("/");
  document.querySelectorAll(".links button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  window.scrollTo(0,0);
  if(v==="exams") return viewExams(arg);
  if(v==="leaderboard") return viewLeaderboard();
  if(v==="about") return viewAbout();
  if(v==="start") return viewStart(arg);
  if(v==="test") return T ? renderQuestion() : go("home");
  if(v==="result") return viewResult();
  viewHome();
}

/* ---- shared UI bits ---- */
const catOf = id => CATEGORIES.find(c=>c.id===id) || {icon:"📝",name:id};
function testTile(t){
  const c = catOf(t.cat);
  return `<div class="card tile" onclick="go('start','${t.id}')">
    <div class="ico">${c.icon}</div>
    <h3>${esc(t.title)}</h3>
    <small>${t.questions.length} MCQs · ${t.minutes} min</small>
    <span class="badge ${t.free?'':'lock'}">${t.free?'FREE':'PREMIUM'}</span>
  </div>`;
}
function langSeg(fn){
  return `<div class="seg">
    <button class="${LANG==='as'?'on':''}" onclick="${fn}('as')">অসমীয়া</button>
    <button class="${LANG==='en'?'on':''}" onclick="${fn}('en')">English</button>
  </div>`;
}
function totalMcqs(){ return TESTS.reduce((n,t)=>n+t.questions.length,0); }

/* ---- HOME ---- */
let sampleChoice = null;
function viewHome(){
  const s = TESTS[0].questions[0];
  const board = leaderboardData().slice(0,3);
  app.innerHTML = `
  <div class="wrap">
    <div class="hero">
      <div>
        <span class="pill">Free · No login needed</span>
        <h1>Practice smart with <em>The Duo</em> mock tests</h1>
        <p class="sub">Timed tests with negative marking, in English and অসমীয়া. Made by The Duo YouTube channel to help you revise after every video.</p>
        <a class="btn primary" onclick="go('exams')">Start Practicing Free</a>
        <a class="btn red" href="${SITE.youtube}" target="_blank" rel="noopener">▶ Watch on YouTube</a>
        <div class="stats">
          <div><b>${totalMcqs()}+</b><small>MCQs</small></div>
          <div><b>${TESTS.length}</b><small>Tests</small></div>
          <div><b>${CATEGORIES.length}</b><small>Categories</small></div>
        </div>
      </div>
      <div class="card sample" id="sample">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div class="tag">TRY A SAMPLE MCQ</div>${langSeg('setLang')}
        </div>
        <div class="q">${esc(tx(s.q))}</div>
        ${s.o.map((o,i)=>`<button class="opt ${sampleClass(i,s)}" onclick="pickSample(${i})">
          <span class="l">${"ABCD"[i]}</span><span>${esc(tx(o))}</span></button>`).join("")}
        <small style="color:var(--muted)">Tap an option — this is how every test works.</small>
      </div>
    </div>

    <section class="blk">
      <div class="sh"><h2>Browse by Category</h2><a onclick="go('exams')">View All</a></div>
      <div class="grid">${CATEGORIES.map(c=>`
        <div class="card tile" onclick="go('exams','${c.id}')">
          <div class="ico">${c.icon}</div><h3>${esc(c.name)}</h3>
          <small>${TESTS.filter(t=>t.cat===c.id).length} tests</small>
        </div>`).join("")}</div>
    </section>

    <section class="blk">
      <div class="sh"><h2>Featured Tests</h2><a onclick="go('exams')">View All</a></div>
      <div class="grid">${TESTS.slice(0,4).map(testTile).join("")}</div>
    </section>

    <section class="blk">
      <div class="sh"><h2>Top 3 This Week</h2><a onclick="go('leaderboard')">View All</a></div>
      <div class="card">${board.length? board.map(lbRow).join("") :
        `<div class="empty">No scores yet. Finish a test to claim the first spot!</div>`}</div>
    </section>

    <section class="blk">
      <div class="sh"><h2>Why The Duo Test</h2></div>
      <div class="why">
        <div class="card"><h3>English + অসমীয়া</h3><p>Switch language anytime, even in the middle of a test.</p></div>
        <div class="card"><h3>Real exam feel</h3><p>Timer plus ${SITE.negativeMarking} negative marking per wrong answer.</p></div>
        <div class="card"><h3>Know where you stand</h3><p>Instant score, accuracy, answer review and a leaderboard.</p></div>
        <div class="card"><h3>Works on any phone</h3><p>No app to install. Open the link and start.</p></div>
      </div>
    </section>

    <section class="blk">
      <div class="cta">
        <div><h2>New videos, new tests</h2><p>Subscribe to The Duo so you never miss a lesson or a mock test.</p></div>
        <a class="btn" style="background:#fff;color:var(--brand)" href="${SITE.youtube}" target="_blank" rel="noopener">Subscribe Now</a>
      </div>
    </section>
  </div>`;
}
function sampleClass(i,s){
  if(sampleChoice===null) return "";
  if(i===s.a) return "right";
  if(i===sampleChoice) return "wrong";
  return "";
}
function pickSample(i){ if(sampleChoice!==null) return; sampleChoice=i; viewHome(); }

/* ---- ALL TESTS ---- */
function viewExams(cat){
  const list = cat ? TESTS.filter(t=>t.cat===cat) : TESTS;
  app.innerHTML = `<div class="wrap" style="padding-top:24px">
    <div class="sh"><h2>${cat? esc(catOf(cat).name):'All Tests'}</h2></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn ghost" onclick="go('exams')">All</button>
      ${CATEGORIES.map(c=>`<button class="btn ghost" onclick="go('exams','${c.id}')">${c.icon} ${esc(c.name)}</button>`).join("")}
    </div>
    <div class="grid">${list.map(testTile).join("") || '<div class="empty">No tests here yet.</div>'}</div>
  </div>`;
}

/* ---- START SCREEN ---- */
function viewStart(id){
  const t = TESTS.find(x=>x.id===id); if(!t) return go("home");
  const past = getAttempts().filter(a=>a.testId===id);
  const best = past.length ? Math.max(...past.map(a=>a.pct)) : null;
  app.innerHTML = `<div class="wrap" style="padding-top:24px;max-width:640px">
    <div class="card">
      <span class="badge ${t.free?'':'lock'}">${t.free?'FREE':'PREMIUM'}</span>
      <h2 style="margin:10px 0 4px">${esc(t.title)}</h2>
      <p style="color:var(--muted)">${esc(catOf(t.cat).name)}</p>
      <div class="rgrid">
        <div><b>${t.questions.length}</b>Questions</div>
        <div><b>${t.minutes} min</b>Time</div>
        <div><b>-${SITE.negativeMarking}</b>Per wrong</div>
        ${best!==null?`<div><b>${best}%</b>Your best</div>`:''}
      </div>
      <p style="margin-bottom:14px;color:var(--muted)">Choose your language. You can switch it during the test too.</p>
      <div style="margin-bottom:18px">${langSeg('setLangStart')}</div>
      ${t.free ? `<button class="btn primary" onclick="beginTest('${t.id}')">Start Test</button>` :
        `<p style="margin-bottom:10px">This is a premium test. Add your own unlock method in the code, or set <code>free:true</code>.</p>
         <a class="btn red" href="${SITE.youtube}" target="_blank" rel="noopener">Get access on YouTube</a>`}
      <button class="btn ghost" onclick="go('exams')">Back</button>
    </div></div>`;
}
function setLangStart(l){ LANG=l; localStorage.setItem("duo_lang",l); viewStart(location.hash.split("/")[1]); }

/* ---- TEST ENGINE ---- */
function beginTest(id){
  const t = TESTS.find(x=>x.id===id);
  T = { test:t, i:0, ans:Array(t.questions.length).fill(null), left:t.minutes*60 };
  clearInterval(timerId);
  timerId = setInterval(()=>{
    T.left--; updateTimer();
    if(T.left<=0){ clearInterval(timerId); finishTest(true); }
  },1000);
  location.hash = "test";
}
function fmt(s){ s=Math.max(0,s); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function updateTimer(){
  const el = $("#timer"); if(!el||!T) return;
  el.textContent = "⏱ "+fmt(T.left);
  el.classList.toggle("low", T.left<=30);
}
function renderQuestion(){
  if(!T) return go("home");
  const t=T.test, q=t.questions[T.i], n=t.questions.length;
  const answered = T.ans.filter(x=>x!==null).length;
  app.innerHTML = `
  <div class="tbar"><div class="wrap">
    <div class="row">
      <b>${esc(t.title)}</b>
      <div style="display:flex;gap:10px;align-items:center">${langSeg('setLang')}<span class="timer" id="timer">⏱ ${fmt(T.left)}</span></div>
    </div>
    <div class="prog"><i style="width:${answered/n*100}%"></i></div>
  </div></div>
  <div class="wrap" style="max-width:720px">
    <div class="qbox card">
      <div class="qno">Question ${T.i+1} of ${n}</div>
      <div class="qtext">${esc(tx(q.q))}</div>
      ${q.o.map((o,i)=>`<button class="opt ${T.ans[T.i]===i?'sel':''}" onclick="choose(${i})">
        <span class="l">${"ABCD"[i]}</span><span>${esc(tx(o))}</span></button>`).join("")}
      <div class="actions">
        <button class="btn ghost" onclick="prevQ()" ${T.i===0?'disabled style="opacity:.4"':''}>← Previous</button>
        <button class="btn ghost" onclick="clearAns()">Clear</button>
        ${T.i<n-1 ? `<button class="btn primary" onclick="nextQ()">Next →</button>`
                  : `<button class="btn primary" onclick="confirmFinish()">Submit</button>`}
      </div>
    </div>
    <div class="card">
      <b>Question palette</b>
      <div class="palette">${t.questions.map((_,i)=>`<button class="${T.ans[i]!==null?'ans':''} ${i===T.i?'cur':''}" onclick="jump(${i})">${i+1}</button>`).join("")}</div>
      <div style="margin-top:14px"><button class="btn red" style="background:var(--bad)" onclick="confirmFinish()">Finish Test</button></div>
    </div>
  </div>`;
  updateTimer();
}
function choose(i){ T.ans[T.i]=i; renderQuestion(); }
function clearAns(){ T.ans[T.i]=null; renderQuestion(); }
function nextQ(){ if(T.i<T.test.questions.length-1){ T.i++; renderQuestion(); } }
function prevQ(){ if(T.i>0){ T.i--; renderQuestion(); } }
function jump(i){ T.i=i; renderQuestion(); }
function confirmFinish(){
  const left = T.ans.filter(x=>x===null).length;
  const msg = left ? `You have ${left} unanswered question(s). Submit anyway?` : "Submit your test?";
  if(confirm(msg)) finishTest(false);
}

/* ---- RESULT ---- */
let LAST = null;
function finishTest(auto){
  clearInterval(timerId);
  const t=T.test, n=t.questions.length;
  let correct=0, wrong=0, skipped=0;
  t.questions.forEach((q,i)=>{
    if(T.ans[i]===null) skipped++;
    else if(T.ans[i]===q.a) correct++;
    else wrong++;
  });
  const marks = correct*SITE.marksPerQuestion - wrong*SITE.negativeMarking;
  const max = n*SITE.marksPerQuestion;
  const pct = Math.max(0, Math.round(marks/max*100));
  const user = getUser();
  LAST = { testId:t.id, title:t.title, correct, wrong, skipped, marks, max, pct, answers:[...T.ans],
           auto, date:Date.now(), name:user?user.name:"Guest", district:user?user.district:"" };
  const all = getAttempts(); all.push({testId:t.id,title:t.title,pct,marks,max,date:LAST.date,name:LAST.name,district:LAST.district});
  store.set("duo_attempts", all.slice(-200));
  location.hash="result";
  if(!user && !sessionStorage.getItem("duo_asked")){
    sessionStorage.setItem("duo_asked","1");
    setTimeout(()=>$("#nameDlg").showModal(),400);
  }
}
function viewResult(){
  if(!LAST || !T) return go("home");
  const t=T.test, r=LAST;
  const msg = r.pct>=80?"Excellent work! 🔥": r.pct>=50?"Good effort, keep practicing 💪":"Keep going, you will improve 📈";
  app.innerHTML = `<div class="wrap" style="max-width:720px;padding-top:24px">
    <div class="card score">
      ${r.auto?'<p style="color:var(--bad);font-weight:700">Time is up! Test auto-submitted.</p>':''}
      <p style="color:var(--muted);font-weight:700">${esc(t.title)}</p>
      <div class="big">${r.pct}%</div>
      <p>${msg}</p>
      <div class="rgrid">
        <div><b style="color:var(--good)">${r.correct}</b>Correct</div>
        <div><b style="color:var(--bad)">${r.wrong}</b>Wrong</div>
        <div><b>${r.skipped}</b>Skipped</div>
        <div><b>${r.marks.toFixed(2)}/${r.max}</b>Marks</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn primary" onclick="beginTest('${t.id}')">Retry</button>
        <button class="btn ghost" onclick="go('exams')">More Tests</button>
        <button class="btn ghost" onclick="go('leaderboard')">Leaderboard</button>
        <button class="btn ghost" onclick="shareScore()">Share</button>
      </div>
    </div>
    <div class="sh" style="margin-top:26px"><h2>Answer Review</h2>${langSeg('setLangResult')}</div>
    ${t.questions.map((q,i)=>reviewItem(q,i,r.answers[i])).join("")}
    <div class="cta" style="margin-top:20px"><div><h3>Liked this test?</h3><p>Watch the related video on The Duo.</p></div>
      <a class="btn" style="background:#fff;color:var(--brand)" href="${SITE.youtube}" target="_blank" rel="noopener">Open YouTube</a></div>
  </div>`;
}
function setLangResult(l){ LANG=l; localStorage.setItem("duo_lang",l); viewResult(); }
function reviewItem(q,i,pick){
  return `<div class="card rev" style="margin-bottom:12px">
    <div class="qno">Q${i+1}${pick===null?' · Skipped':pick===q.a?' · Correct ✅':' · Wrong ❌'}</div>
    <div class="qtext" style="font-size:17px">${esc(tx(q.q))}</div>
    ${q.o.map((o,k)=>`<div class="opt ${k===q.a?'right':(k===pick?'wrong':'')}" style="cursor:default">
      <span class="l">${"ABCD"[k]}</span><span>${esc(tx(o))}</span></div>`).join("")}
    ${q.exp?`<div class="expl"><b>Explanation:</b> ${esc(q.exp)}</div>`:''}
  </div>`;
}
function shareScore(){
  const text = `I scored ${LAST.pct}% in "${LAST.title}" on The Duo Test! Try it: ${location.href.split("#")[0]}`;
  if(navigator.share){ navigator.share({text}).catch(()=>{}); }
  else { navigator.clipboard?.writeText(text); alert("Score text copied. Paste it anywhere to share."); }
}

/* ---- LEADERBOARD ---- */
function leaderboardData(){
  const weekAgo = Date.now()-7*24*3600*1000;
  const best = {};
  getAttempts().filter(a=>a.date>=weekAgo).forEach(a=>{
    const k=a.name; if(!best[k]||a.pct>best[k].pct) best[k]=a;
  });
  return Object.values(best).sort((a,b)=>b.pct-a.pct);
}
function lbRow(a,i){
  const ini = a.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return `<div class="lb-row"><div class="rank">${i+1}</div><div class="av">${esc(ini)}</div>
    <div class="grow"><b>${esc(a.name)}</b><br><small style="color:var(--muted)">${esc(a.district||'')} ${a.district?'· ':''}${esc(a.title)}</small></div>
    <div class="pc">${a.pct}%</div></div>`;
}
function viewLeaderboard(){
  const d = leaderboardData();
  app.innerHTML = `<div class="wrap" style="max-width:720px;padding-top:24px">
    <div class="sh"><h2>Weekly Leaderboard</h2></div>
    <div class="card">${d.length? d.slice(0,20).map(lbRow).join(""):'<div class="empty">No scores yet. Finish a test to appear here.</div>'}</div>
    <p style="color:var(--muted);font-size:13px;margin-top:10px">Note: this leaderboard is stored in this browser only. To make it shared across all students, connect a database (see the setup notes).</p>
  </div>`;
}

/* ---- ABOUT ---- */
function viewAbout(){
  app.innerHTML = `<div class="wrap" style="max-width:720px;padding-top:24px">
    <div class="card"><h2 style="margin-bottom:8px">About The Duo Test</h2>
    <p style="color:var(--muted);margin-bottom:10px">The Duo Test is the practice companion to The Duo YouTube channel. After each video, test yourself with timed MCQs, see your score, read explanations and compete on the weekly board.</p>
    <p style="color:var(--muted);margin-bottom:16px">Every question can be viewed in English and অসমীয়া. Tests follow a simple exam pattern with negative marking of ${SITE.negativeMarking} per wrong answer.</p>
    <a class="btn red" href="${SITE.youtube}" target="_blank" rel="noopener">▶ Visit our YouTube channel</a>
    ${SITE.whatsapp?` <a class="btn ghost" href="${SITE.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>`:''}
    </div></div>`;
}

/* ---- name dialog ---- */
function saveName(){
  const name = $("#nmIn").value.trim(); if(!name) return;
  const district = $("#dsIn").value.trim();
  store.set("duo_user",{name,district});
  const all = getAttempts();
  if(all.length && all[all.length-1].name==="Guest"){ all[all.length-1].name=name; all[all.length-1].district=district; store.set("duo_attempts",all); }
  $("#nameDlg").close();
}
function skipName(){ $("#nameDlg").close(); }

/* ---- boot ---- */
$("#ytTop").href = SITE.youtube;
$("#ytFoot").href = SITE.youtube;
$("#yr").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
